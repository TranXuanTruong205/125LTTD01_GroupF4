<div class="card p-4">
    <div class="d-flex justify-content-between mb-4">
        <h4>Category Management</h4>
        <a href="/admin/categories/create" class="btn btn-primary">+ Add Category</a>
    </div>
    <table class="table">
        <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Icon</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="c : ${categories}">
            <td th:text="${c.categoryId}"></td>
            <td th:text="${c.categoryName}"></td>
            <td>
                <img th:if="${c.icon != null}" th:src="${'/images/' + c.icon}" width="30">
            </td>
            <td>
                <a th:href="@{'/admin/categories/edit/' + ${c.categoryId}}" class="btn btn-sm btn-outline-primary">Edit</a>
                <a th:href="@{'/admin/categories/delete/' + ${c.categoryId}}" class="btn btn-sm btn-outline-danger" onclick="return confirm('Sure?')">Delete</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>

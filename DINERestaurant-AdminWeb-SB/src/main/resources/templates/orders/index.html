<div class="orders-page">

    <div class="orders-header">
        <h4>Orders</h4>

        <div class="orders-tabs">
            <a th:href="@{/admin/orders(tab='all')}"
               th:classappend="${tab=='all'} ? 'active'">All</a>
            <a th:href="@{/admin/orders(tab='active')}"
               th:classappend="${tab=='active'} ? 'active'">Active</a>
            <a th:href="@{/admin/orders(tab='history')}"
               th:classappend="${tab=='history'} ? 'active'">History</a>
        </div>
    </div>

    <div class="orders-card">
        <table class="orders-table">
            <thead>
            <tr>
                <th>#</th>
                <th>Status</th>
                <th>Total</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="o : ${orders}">
                <td th:text="${o.orderId}"></td>
                <td>
                    <span class="badge-status"
                          th:class="'status-' + ${o.orderStatusKey}"
                          th:text="${o.orderStatus}">
                    </span>
                </td>
                <td th:text="${#numbers.formatDecimal(o.totalAmount,0,'COMMA',0,'POINT')} + ' ₫'"></td>
                <td>
                    <a th:href="@{'/admin/orders/' + ${o.orderId}}"
                       class="btn-detail">View</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

</div>

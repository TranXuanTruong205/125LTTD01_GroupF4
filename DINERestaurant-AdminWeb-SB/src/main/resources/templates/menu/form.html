<div class="card p-4" style="max-width: 800px; margin: 0 auto;">
    <h4 class="mb-4" th:text="${menuItem.itemId == null ? 'Add New Item' : 'Edit Item'}"></h4>
    <form action="/admin/menu/save" method="post" th:object="${menuItem}">
        <input type="hidden" th:field="*{itemId}">
        <div class="mb-3">
            <label class="form-label">Item Name</label>
            <input type="text" class="form-control" th:field="*{itemName}" required>
        </div>
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Category</label>
                <select class="form-select" th:field="*{categoryId}">
                    <option th:each="c : ${categories}"
                            th:value="${c.categoryId}"
                            th:text="${c.categoryName}"></option>
                </select>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Price</label>
                <input type="number" class="form-control" th:field="*{price}" required>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">Image URL</label>
            <input type="text" class="form-control" th:field="*{image}" placeholder="e.g. burger.jpg">
        </div>
        <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea class="form-control" rows="3" th:field="*{description}"></textarea>
        </div>
        <div class="mb-4 form-check">
            <input type="checkbox" class="form-check-input" th:field="*{isAvailable}" id="isAvailable">
            <label class="form-check-label" for="isAvailable">Available</label>
        </div>
        <div class="d-flex justify-content-end gap-2">
            <a href="/admin/menu" class="btn btn-secondary">Cancel</a>
            <button type="submit" class="btn btn-primary">Save Item</button>
        </div>
    </form>
</div>
